<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>
<body class="reader-theme">
    <div class="header">
        <h1><img src="/images/FLICKER.png" alt="Flicker Icon" class="header-icon">Flicker</h1>
        <p>Your daily dose of inspiration.</p>
    </div>

    <div class="nav">
        <a th:href="@{/reader/home(userId=${userId})}" class="active">Home</a>
        <a th:href="@{/reader/following(userId=${userId})}">Following</a>
        <a th:href="@{/reader/suggestions(userId=${userId})}">Suggestions</a>
        <a th:href="@{/reader/profile(userId=${userId})}">Profile</a>
        <button id="theme-toggle" class="btn btn-secondary btn-sm" style="margin: 0 1rem; cursor: pointer;">🌙</button>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="logout-link" style="background: none; border: none; color: inherit; cursor: pointer; font: inherit; padding: 0; margin: 0;">Logout</button>
        </form>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; margin-bottom: 1.5rem;">
            <h2 style="margin: 0;">WELCOME, <strong th:text="${currentUser.name}">Reader</strong>!</h2>
        </div>

        <div style="margin-top: 2rem;">
            <div class="success-message" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <div th:if="${posts.isEmpty()}">
                <p>No posts available. Check out the <a th:href="@{/reader/suggestions(userId=${userId})}">writers page</a> to follow some writers!</p>
            </div>

            <div th:each="post : ${posts}" class="post">
                <div class="post-header">
                    <div>
                        <strong><span th:text="${post.authorName}">Author Name</span></strong>
                        <small th:text="'• ' + ${#temporals.format(post.timestamp, 'MMM dd, yyyy, hh:mm a')}">Date and Time</small>
                    </div>
                </div>
                <p th:text="${post.content}">Post content goes here.</p>
                
                <!-- Image Display Section -->
                <div th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}" class="post-image" style="margin: 1rem 0;">
                    <img th:src="${post.imageUrl}" th:alt="${post.imageCaption != null ? post.imageCaption : 'Post image'}" 
                         style="max-width: 100%; max-height: 400px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <p th:if="${post.imageCaption != null and !post.imageCaption.isEmpty()}" 
                       th:text="${post.imageCaption}" style="margin-top: 0.5rem; font-style: italic; color: #6c757d; font-size: 0.9rem;"></p>
                </div>
                
                <div class="post-actions" style="display: flex; gap: 0.5rem; align-items: center;">
                    <form th:action="@{/post/vote/{postId}(postId=${post.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="vote" value="up"/>
                        <input type="hidden" name="userId" th:value="${userId}"/>
                        <button type="submit" class="btn btn-success btn-xs" title="Upvote">⬆️ (<span th:text="${post.upvoteCount}">0</span>)</button>
                    </form>
                    <form th:action="@{/post/vote/{postId}(postId=${post.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="vote" value="down"/>
                        <input type="hidden" name="userId" th:value="${userId}"/>
                        <button type="submit" class="btn btn-danger btn-xs" title="Downvote">⬇️ (<span th:text="${post.downvoteCount}">0</span>)</button>
                    </form>
                </div>

                <!-- Comments Section -->
                <div class="comments-section">
                    <h4>Comments</h4>
                    <div th:each="comment : ${post.comments}" class="comment">
                        <p th:text="${comment.content}">Comment text.</p>
                        <small th:text="'by ' + ${comment.authorName} + ' on ' + ${#temporals.format(comment.timestamp, 'dd-MMM-yyyy, hh:mm a')}">Commenter and Date</small>
                        <div class="comment-controls">
                            <div class="comment-voting">
                                 <form th:action="@{/comment/upvote/{commentId}(commentId=${comment.id})}" method="post" style="display:inline;">
                                    <input type="hidden" name="userId" th:value="${userId}"/>
                                    <button type="submit" class="btn btn-success btn-xs">⬆️ (<span th:text="${comment.upvoteCount}">0</span>)</button>
                                 </form>
                                 <form th:action="@{/comment/downvote/{commentId}(commentId=${comment.id})}" method="post" style="display:inline;">
                                    <input type="hidden" name="userId" th:value="${userId}"/>
                                    <button type="submit" class="btn btn-danger btn-xs">⬇️ (<span th:text="${comment.downvoteCount}">0</span>)</button>
                                 </form>
                            </div>
                            <div th:if="${comment.authorId == session.userId}" class="comment-actions">
                                <a th:href="@{/comment/edit/{commentId}(commentId=${comment.id}, userId=${userId})}" class="btn btn-secondary btn-xs">Edit</a>
                                <form th:action="@{/comment/delete/{commentId}(commentId=${comment.id})}" method="post" style="display:inline;">
                                    <input type="hidden" name="userId" th:value="${userId}"/>
                                    <button type="submit" class="btn btn-danger btn-xs">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Add Comment Form -->
                    <div class="add-comment-form" style="margin-top: 1.5rem;">
                        <form th:action="@{/comment/create}" th:object="${createCommentDTO}" method="post">
                            <input type="hidden" name="postId" th:value="${post.id}"/>
                            <input type="hidden" name="userId" th:value="${userId}"/>
                            <div class="form-group">
                                <textarea th:field="*{content}" class="form-control comment-textarea" rows="1" placeholder="Add a comment..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-sm">Add Comment</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        
        // Check for saved theme preference or default to light theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);
        
        // Theme toggle click handler
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });
        
        // Update theme icon
        function updateThemeIcon(theme) {
            themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
