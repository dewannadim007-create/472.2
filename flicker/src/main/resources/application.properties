# Application Name
spring.application.name=flicker

# Server Configuration - PORT will be provided by Render.com
server.port=${PORT:8080}

# MongoDB Atlas Connection - Use environment variable for security
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/FLICKER}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Upload Directory - Use /tmp for cloud deployments, local path for development
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}

# OpenAI API Key - Use environment variable for security
openai.api.key=${OPENAI_API_KEY:}