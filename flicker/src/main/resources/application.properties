# Server configuration - PORT is provided by Render
server.port=${PORT:8080}

# MongoDB Atlas connection - Use environment variable
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/FLICKER}

# Application name
spring.application.name=flicker

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Upload directory - use relative path for cloud deployment
app.upload.dir=${UPLOAD_DIR:./uploads}

# OpenAI API key - Use environment variable
openai.api.key=${OPENAI_API_KEY:}