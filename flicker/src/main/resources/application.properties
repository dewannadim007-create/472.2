spring.application.name=flicker
# Use PORT environment variable for deployment (Render sets this automatically)
server.port=${PORT:8080}

# MongoDB Configuration
# Use MONGODB_URI environment variable for deployment
# Falls back to local MongoDB for development if not set
# Database name is 'flicker' (lowercase)
# Note: Do not include 'appName' parameter in connection string as it can cause DNS resolution issues
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/flicker}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Use UPLOAD_DIR environment variable for deployment
app.upload.dir=${UPLOAD_DIR:uploads}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
