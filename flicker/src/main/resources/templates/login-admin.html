<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="auth-page">

    <div class="ambient-light">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-container">
        <img src="/images/FLICKER.png" alt="Flicker Logo" class="auth-logo">
        <h2>Admin Access</h2>
        <p class="subtitle">Enter credentials to manage the platform</p>

        <div class="error-message" th:if="${param.error}" style="text-align: center;">
            Invalid admin credentials.
        </div>
        <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}" style="text-align: center;"></div>

        <form th:action="@{/login/process}" method="post"
            style="display: flex; flex-direction: column; gap: var(--spacing-md);">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="expectedRole" value="ADMIN" />

            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" placeholder="Admin username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Admin password" required>
            </div>

            <button type="submit" class="btn"
                style="width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 12px; font-weight: 700; margin-top: var(--spacing-sm); background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--border);">
                Authenticate Admin
            </button>
        </form>

        <div
            style="text-align: center; margin-top: var(--spacing-lg); padding-top: var(--spacing-md); border-top: 1px solid var(--border);">
            <p style="margin: 0; color: var(--text-3); font-size: 0.75rem;">
                Back to <a th:href="@{/landing}" class="auth-link">Landing Page</a>
            </p>
        </div>
    </div>

    <script th:inline="javascript">
        document.body.setAttribute('data-theme', 'dark');
    </script>
</body>

</html>
