<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <script th:src="@{/js/votes.js}" defer></script>
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="reader-theme">
    <div class="header">
        <h1><img src="/images/FLICKER.png" alt="Flicker Icon" class="header-icon">Flicker</h1>
        <p>Your daily dose of inspiration.</p>
    </div>

    <div class="nav">
        <div
            style="padding: 10px 15px; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700;">
            Feeds</div>
        <a th:href="@{/reader/home(userId=${userId})}" class="active">Home</a>
        <a th:href="@{/reader/following(userId=${userId})}">Following</a>
        <a th:href="@{/reader/suggestions(userId=${userId})}">Suggestions</a>

        <div
            style="padding: 10px 15px; margin-top: 10px; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700;">
            Account</div>
        <a th:href="@{/reader/profile(userId=${userId})}">Profile</a>

        <button id="theme-toggle">🌙</button>
        <form th:action="@{/logout}" method="post" style="width: 100%;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="welcome-header">
            <h2 style="margin: 0;">Welcome, <strong th:text="${currentUser.name}">Reader</strong>!</h2>
        </div>

        <div style="margin-top: 1rem;">
            <div class="success-message" th:if="${successMessage}" th:text="${successMessage}"
                style="background: #D4EDDA; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 1rem;">
            </div>
            <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"
                style="background: #F8D7DA; color: #721C24; padding: 10px; border-radius: 4px; margin-bottom: 1rem;">
            </div>

            <div th:if="${posts.isEmpty()}">
                <p>No posts available. Check out the <a th:href="@{/reader/suggestions(userId=${userId})}">writers
                        page</a> to follow some writers!</p>
            </div>

            <div th:each="post : ${posts}" class="post">
                <!-- Vote Column -->
                <div class="post-actions">
                    <button class="vote-btn upvote" th:data-post-id="${post.id}">▲</button>
                    <span class="vote-count" th:text="${post.upvoteCount - post.downvoteCount}">0</span>
                    <button class="vote-btn downvote" th:data-post-id="${post.id}">▼</button>
                </div>

                <!-- Post Content on the Right -->
                <div class="post-wrapper">
                    <div class="post-header">
                        <strong th:text="${post.authorName}">Author Name</strong>
                        <span style="margin: 0 4px;">•</span>
                        <small th:text="${#temporals.format(post.timestamp, 'MMM dd, yyyy')}">Date</small>
                    </div>

                    <p th:text="${post.content}" style="margin-bottom: 10px;">Post content goes here.</p>

                    <!-- Image Display Section -->
                    <div th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}" class="post-image"
                        style="margin-bottom: 10px;">
                        <img th:src="${post.imageUrl}"
                            th:alt="${post.imageCaption != null ? post.imageCaption : 'Post image'}">
                        <p th:if="${post.imageCaption != null and !post.imageCaption.isEmpty()}"
                            th:text="${post.imageCaption}"
                            style="margin-top: 0.5rem; font-style: italic; color: #6c757d; font-size: 0.9rem;"></p>
                    </div>

                    <!-- Footer Actions (Comments specific) -->
                    <div
                        style="display: flex; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 8px;">
                        <button class="btn btn-secondary btn-xs" style="border-radius: 4px;">💬 <span
                                th:text="${post.comments.size()}">0</span> Comments</button>
                    </div>

                    <!-- Comments Section (Simplified) -->
                    <div class="comments-section">
                        <div th:each="comment : ${post.comments}" class="comment">
                            <div style="display: flex; justify-content: space-between;">
                                <small style="font-weight: bold;" th:text="${comment.authorName}">User</small>
                                <small th:text="${#temporals.format(comment.timestamp, 'hh:mm a')}">Time</small>
                            </div>
                            <p th:text="${comment.content}" style="margin: 4px 0;">Comment text.</p>
                        </div>

                        <!-- Add Comment Form -->
                        <div class="add-comment-form" style="margin-top: 10px;">
                            <form th:action="@{/comment/create}" th:object="${createCommentDTO}" method="post"
                                style="display: flex; gap: 8px;">
                                <input type="hidden" name="postId" th:value="${post.id}" />
                                <input type="hidden" name="userId" th:value="${userId}" />
                                <input type="text" th:field="*{content}" placeholder="Add a comment..."
                                    style="flex: 1; font-size: 0.9rem;">
                                <button type="submit" class="btn btn-sm">Post</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Check for saved theme preference or default to light theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        // Theme toggle click handler
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // Update theme icon
        function updateThemeIcon(theme) {
            themeToggle.textContent = theme === 'light' ? '🌙 Switch to Dark' : '☀️ Switch to Light';
        }
    </script>
</body>

</html>
