<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Comment - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <script th:src="@{/js/nav-utils.js}" defer></script>
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="reader-theme">
    <div class="nav-overlay" id="navOverlay"></div>
    <div class="header">
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
        <div class="header-center">
            <h1><img src="/images/FLICKER.png" alt="Flicker Icon" class="header-icon">Flicker</h1>
        </div>
    </div>

    <div class="nav" id="sidebar">
        <!-- User Info at Top -->
        <div style="padding: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); text-align: center;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin: 0 auto 0.5rem;"
                th:text="${currentUser.name != null && !currentUser.name.isEmpty() ? #strings.substring(currentUser.name, 0, 1) : 'U'}">
                U</div>
            <strong style="display: block; font-size: 0.95rem; color: var(--text-1);"
                th:text="${currentUser.name}">Reader</strong>
            <span style="font-size: 0.8rem; color: var(--text-3);"
                th:text="'@' + ${currentUser.username}">@username</span>
        </div>

        <!-- Navigation Links -->
        <div class="section-header">FEEDS</div>
        <a th:href="@{/reader/home(userId=${userId})}">Home</a>
        <a th:href="@{/reader/following(userId=${userId})}">Following</a>
        <a th:href="@{/reader/suggestions(userId=${userId})}">Suggestions</a>

        <div class="section-header">ACCOUNT</div>
        <a th:href="@{/reader/profile(userId=${userId})}">Profile</a>

        <!-- Theme Toggle -->
        <button id="theme-toggle-sidebar"
            style="margin-top: auto; padding: 12px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-1); border-radius: var(--radius); cursor: pointer; font-weight: 600; font-size: 0.9rem;">Switch
            Theme</button>

        <!-- Logout -->
        <form th:action="@{/logout}" method="post" style="width: 100%;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="form-container" style="margin-top: 2rem;">
            <h2>Edit Your Comment</h2>
            <p>Make changes to your comment below and save.</p>

            <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/comment/edit/{id}(id=${comment.id})}" th:object="${createCommentDTO}" method="post">
                <input type="hidden" name="userId" th:value="${userId}" />
                <div class="form-group">
                    <label for="content">Comment</label>
                    <textarea id="content" th:field="*{content}" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn">Save Changes</button>
                <a th:href="@{/reader/home(userId=${userId})}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

    <script>
        // No inline theme script needed as nav-utils.js handles it
    </script>
</body>

</html>
