<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="reader-theme auth-page">

    <div class="auth-container">
        <img src="/images/FLICKER.png" alt="Flicker Logo" class="auth-logo">
        <h2>Flicker</h2>
        <p class="subtitle">Log in to your account</p>

        <div class="error-message" th:if="${param.error}" style="text-align: center;">
            Invalid username or password.
        </div>
        <div class="success-message" th:if="${param.logout}" style="text-align: center;">
            You've been logged out.
        </div>
        <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}" style="text-align: center;"></div>

        <form th:action="@{/login}" method="post"
            style="display: flex; flex-direction: column; gap: var(--spacing-md);">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn"
                style="width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 12px; font-weight: 700; margin-top: var(--spacing-sm);">
                Sign In
            </button>
        </form>

        <div
            style="text-align: center; margin-top: var(--spacing-xl); padding-top: var(--spacing-lg); border-top: 1px solid var(--border);">
            <p style="margin: 0; color: var(--text-2); font-size: 0.875rem;">
                Don't have an account? <a th:href="@{/register}" class="auth-link">Join Flicker</a>
            </p>
        </div>
    </div>

    <script th:inline="javascript">
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', currentTheme);
    </script>
</body>

</html>
