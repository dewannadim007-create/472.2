<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="reader-theme auth-page">

    <div class="auth-container wide">
        <img src="/images/FLICKER.png" alt="Flicker Logo" class="auth-logo">
        <h2>Join Flicker</h2>
        <p class="subtitle">Start your microblogging journey</p>

        <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}" style="text-align: center;"></div>

        <form th:action="@{/register}" th:object="${registrationDTO}" method="post"
            style="display: flex; flex-direction: column; gap: var(--spacing-md);">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="janesmith" required autofocus>
                </div>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="Jane Smith" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="••••••••"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="role">My Role</label>
                <select id="role" th:field="*{role}" required style="width: 100%;">
                    <option value="" disabled selected>Select your journey</option>
                    <option value="READER">Reader (Passionate about content)</option>
                    <option value="WRITER">Writer (Passionate about sharing)</option>
                </select>
            </div>

            <div class="form-group">
                <label style="margin-bottom: 0.75rem; display: block;">Select Interests</label>
                <div class="interests-checkboxes"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; max-height: 200px; overflow-y: auto; padding: 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-page);">
                    <label
                        th:each="interest : ${ {'technology','science','art','music','sports','travel','food','fashion','health','education','business','gaming','books'} }"
                        style="display: flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer;">
                        <input type="checkbox" name="selectedInterests" th:value="${interest}"
                            style="width: 18px; height: 18px; accent-color: var(--primary);">
                        <span th:text="${#strings.capitalize(interest)}">Interest</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn"
                style="width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 12px; font-weight: 700; margin-top: var(--spacing-sm);">
                Create Account
            </button>
        </form>

        <div
            style="text-align: center; margin-top: var(--spacing-xl); padding-top: var(--spacing-lg); border-top: 1px solid var(--border);">
            <p style="margin: 0; color: var(--text-2); font-size: 0.875rem;">
                Already have an account? <a th:href="@{/login}" class="auth-link">Sign in here</a>
            </p>
        </div>
    </div>

    <script th:inline="javascript">
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', currentTheme);
    </script>
</body>

</html>
