<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Followers - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <script th:src="@{/js/nav-utils.js}" defer></script>
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="writer-theme">
    <div class="nav-overlay" id="navOverlay"></div>

    <div class="header">
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
        <div class="header-center">
            <h1><img src="/images/FLICKER.png" alt="Flicker Icon" class="header-icon">Flicker <span
                    style="font-weight: 300; font-size: 0.8em; margin-left: 8px; opacity: 0.8;">Studio</span></h1>
        </div>
    </div>

    <div class="nav" id="sidebar">
        <!-- User Info at Top of Sidebar -->
        <div style="padding: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); text-align: center;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin: 0 auto 0.5rem;"
                th:text="${currentUser.name != null && !currentUser.name.isEmpty() ? #strings.substring(currentUser.name, 0, 1) : 'U'}">
                U</div>
            <strong style="display: block; font-size: 0.95rem; color: var(--text-1);"
                th:text="${currentUser.name}">Writer</strong>
            <span style="font-size: 0.8rem; color: var(--text-3);"
                th:text="'@' + ${currentUser.username}">@username</span>
        </div>

        <div class="section-header">STUDIO</div>
        <a th:href="@{/writer/home(userId=${userId})}">Dashboard</a>
        <a th:href="@{/writer/my-posts(userId=${userId})}">My Posts</a>
        <a th:href="@{/writer/post/new(userId=${userId})}">Create Post</a>
        <a th:href="@{/writer/followers(userId=${userId})}" class="active">Followers</a>

        <div class="section-header">ACCOUNT</div>
        <a th:href="@{/writer/profile(userId=${userId})}">Profile</a>

        <button id="theme-toggle-sidebar"
            style="margin-top: auto; padding: 12px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-1); border-radius: var(--radius); cursor: pointer; font-weight: 600; font-size: 0.9rem;">Switch
            Theme</button>
        <form th:action="@{/logout}" method="post" style="width: 100%;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <div class="container">
        <div style="margin-top: 1rem; width: 100%;">
            <h2 style="margin-top: 0; margin-bottom: 0.5rem;">Your Followers</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Here is a list of readers who follow you.
            </p>

            <div th:if="${followers.isEmpty()}"
                style="background: var(--card-bg); padding: 3rem; border-radius: 8px; border: 1px dashed var(--border-color); text-align: center;">
                <h4>You don't have any followers yet.</h4>
                <p>Keep writing great content to attract followers!</p>
            </div>

            <div class="user-card-grid">
                <div th:each="follower : ${followers}" class="user-card">
                    <div class="user-avatar"
                        th:text="${follower.name != null && !follower.name.isEmpty() ? #strings.substring(follower.name, 0, 1) : 'U'}">
                        U</div>
                    <h3 th:text="${follower.name}">Follower Name</h3>
                    <p th:text="'@' + ${follower.username}">@username</p>
                    <div style="margin-top: auto; width: 100%;">
                        <button class="btn btn-secondary btn-sm" style="width: 100%;">View Profile</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Universal initialization handled by nav-utils.js
    </script>
</body>

</html>
