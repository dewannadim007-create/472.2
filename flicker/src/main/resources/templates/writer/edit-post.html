<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="writer-theme">
    <div class="header">
        <h1><img src="/images/FLICKER.png" alt="Flicker Icon" class="header-icon">Flicker <span
                style="font-weight: 300; font-size: 0.8em; margin-left: 8px; opacity: 0.8;">Studio</span></h1>
        <p>Your daily dose of inspiration.</p>
    </div>

    <div class="nav">
        <div class="section-header">Studio</div>
        <a th:href="@{/writer/home(userId=${userId})}">Dashboard</a>
        <a th:href="@{/writer/post/new(userId=${userId})}">Create Post</a>
        <a th:href="@{/writer/followers(userId=${userId})}">Followers</a>

        <div class="section-header">Account</div>
        <a th:href="@{/writer/profile(userId=${userId})}">Profile</a>

        <button id="theme-toggle">🌙</button>
        <form th:action="@{/logout}" method="post" style="width: 100%;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="welcome-header" style="margin-bottom: var(--spacing-lg); text-align: left; width: 100%;">
            <h2 style="margin: 0; font-weight: 800;">Edit Post</h2>
            <p style="color: var(--text-2); margin: 0;">Make changes to your post below and save.</p>
        </div>

        <div class="form-container" style="width: 100%;">
            <div class="error-message" th:if="${#fields.hasErrors('${createPostDTO.*}')}">
                <ul style="margin: 0; padding-left: 20px;">
                    <li th:each="err : ${#fields.errors('${createPostDTO.*}')}" th:text="${err}"></li>
                </ul>
            </div>
            <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}">
            </div>

            <form th:action="@{/writer/post/{postId}/edit(postId=${post.id})}" th:object="${createPostDTO}"
                method="post" enctype="multipart/form-data">
                <input type="hidden" name="userId" th:value="${userId}" />

                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" th:field="*{content}" rows="12" required autofocus
                        style="resize: vertical; font-family: var(--font-content); font-size: 1.1rem; line-height: 1.6;"></textarea>
                </div>

                <!-- Image Management Section -->
                <div
                    style="background: var(--bg-hover); padding: var(--spacing-md); border-radius: var(--radius); margin-bottom: var(--spacing-lg);">
                    <h4 style="margin-bottom: var(--spacing-sm); color: var(--text-1);">Visuals</h4>

                    <!-- Existing Image Display -->
                    <div th:if="${post.imageUrl != null}" style="margin-bottom: var(--spacing-md);">
                        <p style="font-size: 0.9rem; font-weight: 600; margin-bottom: 8px;">Current Image:</p>
                        <img th:src="${post.imageUrl}" alt="Post Image"
                            style="max-height: 200px; border-radius: 8px; border: 1px solid var(--border);">

                        <div style="margin-top: 8px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" name="removeImage" value="true">
                                <span style="color: var(--danger); font-weight: 500;">Remove this image</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="imageFile"
                            th:text="${post.imageUrl != null ? 'Change Image' : 'Upload Image'}">Upload Image</label>
                        <input type="file" id="imageFile" name="imageFile" accept="image/*">
                        <p style="font-size: 0.8rem; color: var(--text-3); margin-top: 4px;">Supports JPG, PNG, GIF</p>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="imageCaption">Image Caption</label>
                        <input type="text" id="imageCaption" th:field="*{imageCaption}"
                            placeholder="Add a caption for your image...">
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/writer/home(userId=${userId})}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const currentTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            themeToggle.textContent = theme === 'light' ? '🌙 Switch to Dark' : '☀️ Switch to Light';
        }
    </script>
</body>

</html>
