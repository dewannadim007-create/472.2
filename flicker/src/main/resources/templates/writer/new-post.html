<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Post - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/reddit-style.css}">
    <link rel="icon" a="1" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="writer-theme">
    <div class="header">
        <h1><img src="/images/FLICKER.png" alt="Flicker Icon" class="header-icon">Flicker <span
                style="font-weight: 300; font-size: 0.8em; margin-left: 8px; opacity: 0.8;">Studio</span></h1>
        <p>Your daily dose of inspiration.</p>
    </div>

    <div class="nav">
        <div
            style="padding: 10px 15px; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700;">
            Studio</div>
        <a th:href="@{/writer/home(userId=${userId})}">Dashboard</a>
        <a th:href="@{/writer/post/new(userId=${userId})}" class="active">Create Post</a>
        <a th:href="@{/writer/followers(userId=${userId})}">Followers</a>

        <div
            style="padding: 10px 15px; margin-top: 10px; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700;">
            Account</div>
        <a th:href="@{/writer/profile(userId=${userId})}">Profile</a>

        <button id="theme-toggle">🌙</button>
        <form th:action="@{/logout}" method="post" style="width: 100%;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="form-container"
            style="margin-top: 1rem; background: var(--card-bg); padding: 20px; border-radius: 4px; border: 1px solid var(--border-color);">
            <h2 style="margin-top: 0;">Create a New Post</h2>
            <p style="color: var(--text-secondary);">Share your thoughts with your followers.</p>

            <div class="error-message" th:if="${#fields.hasErrors('${createPostDTO.*}')}"
                style="background: #F8D7DA; color: #721C24; padding: 10px; border-radius: 4px; margin-bottom: 1rem;">
                <ul style="margin: 0; padding-left: 20px;">
                    <li th:each="err : ${#fields.errors('${createPostDTO.*}')}" th:text="${err}"></li>
                </ul>
            </div>
            <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"
                style="background: #F8D7DA; color: #721C24; padding: 10px; border-radius: 4px; margin-bottom: 1rem;">
            </div>

            <form id="post-form" th:action="@{/writer/post/with-image}" th:object="${createPostDTO}" method="post"
                enctype="multipart/form-data">
                <input type="hidden" name="userId" th:value="${userId}" />
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="content" style="display: block; font-weight: bold; margin-bottom: 5px;">Content</label>
                    <textarea id="content" th:field="*{content}" rows="10" required autofocus
                        style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color); resize: vertical;"></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="imageFile" style="display: block; font-weight: bold; margin-bottom: 5px;">Image
                        (Optional)</label>
                    <input type="file" id="imageFile" name="imageFile" accept="image/*" onchange="previewImage(this)"
                        style="display: block; width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color);">
                    <small style="color: var(--text-secondary);">Supported formats: JPG, PNG, GIF, BMP, WebP. Max size:
                        10MB</small>
                </div>

                <div id="imagePreview" style="display: none; margin: 1rem 0;">
                    <img id="previewImg"
                        style="max-width: 100%; max-height: 300px; border-radius: 4px; border: 1px solid var(--border-color);">
                    <button type="button" onclick="removeImage()" class="btn btn-secondary btn-sm"
                        style="margin-top: 0.5rem; color: #dc3545; border-color: #dc3545;">Remove Image</button>
                </div>

                <div class="form-group" id="captionGroup" style="display: none; margin-bottom: 15px;">
                    <label for="imageCaption" style="display: block; font-weight: bold; margin-bottom: 5px;">Image
                        Caption (Optional)</label>
                    <input type="text" id="imageCaption" th:field="*{imageCaption}"
                        placeholder="Add a caption to your image..."
                        style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color);">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn" style="flex: 1;">Publish Post</button>
                    <button type="button" id="ai-generate-btn" class="btn btn-secondary" style="flex: 1;">Generate with
                        AI</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Image preview functionality
        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                    document.getElementById('captionGroup').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            document.getElementById('imageFile').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('captionGroup').style.display = 'none';
            document.getElementById('imageCaption').value = '';
        }

        document.getElementById('ai-generate-btn').addEventListener('click', function () {
            var content = document.getElementById('content').value;
            if (!content) {
                alert('Please enter some content first to generate more.');
                return;
            }

            fetch('/writer/generate-content?content=' + encodeURIComponent(content))
                .then(response => response.text())
                .then(data => {
                    document.getElementById('content').value = data;
                })
                .catch(error => {
                    console.error('Error generating AI content:', error);
                    alert('Failed to generate AI content. Please try again.');
                });
        });

        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Check for saved theme preference or default to light theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        // Theme toggle click handler
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // Update theme icon
        function updateThemeIcon(theme) {
            themeToggle.textContent = theme === 'light' ? '🌙 Switch to Dark' : '☀️ Switch to Light';
        }
    </script>
</body>

</html>
