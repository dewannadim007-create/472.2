<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Post - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <script th:src="@{/js/nav-utils.js}" defer></script>
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="writer-theme">
    <div class="nav-overlay" id="navOverlay"></div>
    <div class="header">
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
        <div class="header-center">
            <h1><img src="/images/FLICKER.png" alt="Flicker Icon" class="header-icon">Flicker <span
                    style="font-weight: 300; font-size: 0.8em; margin-left: 8px; opacity: 0.8;">Studio</span></h1>
        </div>
    </div>
    <div class="nav" id="sidebar">
        <!-- User Info at Top of Sidebar -->
        <div style="padding: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); text-align: center;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin: 0 auto 0.5rem;"
                th:text="${#strings.substring(currentUser.name, 0, 1)}">U</div>
            <strong style="display: block; font-size: 0.95rem; color: var(--text-1);"
                th:text="${currentUser.name}">Writer</strong>
            <span style="font-size: 0.8rem; color: var(--text-3);"
                th:text="'@' + ${currentUser.username}">@username</span>
        </div>

        <div class="section-header">STUDIO</div>
        <a th:href="@{/writer/home(userId=${userId})}">Dashboard</a>
        <a th:href="@{/writer/my-posts(userId=${userId})}">My Posts</a>
        <a th:href="@{/writer/post/new(userId=${userId})}" class="active">Create Post</a>
        <a th:href="@{/writer/followers(userId=${userId})}">Followers</a>

        <div class="section-header">ACCOUNT</div>
        <a th:href="@{/writer/profile(userId=${userId})}">Profile</a>

        <button id="theme-toggle-sidebar"
            style="margin-top: auto; padding: 12px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-1); border-radius: var(--radius); cursor: pointer; font-weight: 600; font-size: 0.9rem;">Switch
            Theme</button>
        <form th:action="@{/logout}" method="post" style="width: 100%;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="welcome-header" style="margin-bottom: var(--spacing-lg); text-align: left; width: 100%;">
            <h2 style="margin: 0; font-weight: 800;">Create a New Post</h2>
            <p style="color: var(--text-2); margin: 0;">Share your thoughts with your followers.</p>
        </div>

        <div class="form-container" style="width: 100%;">
            <div class="error-message" th:if="${#fields.hasErrors('${createPostDTO.*}')}">
                <ul style="margin: 0; padding-left: 20px;">
                    <li th:each="err : ${#fields.errors('${createPostDTO.*}')}" th:text="${err}"></li>
                </ul>
            </div>
            <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}">
            </div>

            <form id="post-form" th:action="@{/writer/post/with-image}" th:object="${createPostDTO}" method="post"
                enctype="multipart/form-data">
                <input type="hidden" name="userId" th:value="${userId}" />

                <!-- Main Content -->
                <div class="form-group">
                    <label for="content">What's on your mind?</label>
                    <textarea id="content" th:field="*{content}" rows="12" required autofocus
                        placeholder="Start writing your masterpiece..."
                        style="resize: vertical; font-family: var(--font-content); font-size: 1.1rem; line-height: 1.6;"></textarea>
                </div>

                <div class="form-group">
                    <label for="visibility">Post Visibility</label>
                    <select id="visibility" th:field="*{visibility}">
                        <option value="PUBLIC">Public (Visible to everyone)</option>
                        <option value="PRIVATE">Private (Only visible to followers)</option>
                    </select>
                    <p style="font-size: 0.8rem; color: var(--text-3); margin-top: 4px;">Public posts appear on your
                        profile. Private posts are only for your followers.</p>
                </div>

                <!-- Image Upload Section -->
                <div
                    style="background: var(--bg-input); padding: var(--spacing-lg); border-radius: var(--radius); margin-bottom: var(--spacing-lg); border: 1px solid var(--border);">
                    <h4 style="margin-bottom: var(--spacing-md); color: var(--text-1);">Add Visuals (Optional)</h4>

                    <div class="form-group">
                        <label for="imageFile" style="color: var(--text-1);">Upload Image</label>
                        <input type="file" id="imageFile" name="imageFile" accept="image/*">
                        <p style="font-size: 0.8rem; color: var(--text-3); margin-top: 4px;">Supports JPG, PNG, GIF</p>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="imageCaption" style="color: var(--text-1);">Image Caption</label>
                        <input type="text" id="imageCaption" th:field="*{imageCaption}"
                            placeholder="Add a caption for your image...">
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/writer/home(userId=${userId})}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn" style="min-width: 120px;">Publish Post</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Logic handled by nav-utils.js
    </script>
</body>

</html>
