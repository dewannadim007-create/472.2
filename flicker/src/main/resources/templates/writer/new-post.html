<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Post - Flicker</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" a="1" type="image/png" th:href="@{/images/FLICKER.png}">
</head>

<body class="writer-theme">
    <div class="header">
        <h1><img src="/images/FLICKER.png" alt="Flicker Icon" class="header-icon">Flicker <span
                style="font-weight: 300; font-size: 0.8em; margin-left: 8px; opacity: 0.8;">Studio</span></h1>
        <p>Your daily dose of inspiration.</p>
    </div>

    <div class="nav">
        <div
            style="padding: 10px 15px; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700;">
            Studio</div>
        <a th:href="@{/writer/home(userId=${userId})}">Dashboard</a>
        <a th:href="@{/writer/post/new(userId=${userId})}" class="active">Create Post</a>
        <a th:href="@{/writer/followers(userId=${userId})}">Followers</a>

        <div
            style="padding: 10px 15px; margin-top: 10px; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700;">
            Account</div>
        <a th:href="@{/writer/profile(userId=${userId})}">Profile</a>

        <button id="theme-toggle">🌙</button>
        <form th:action="@{/logout}" method="post" style="width: 100%;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="welcome-header" style="margin-bottom: var(--spacing-lg);">
            <h2 style="margin: 0;">Create a New Post</h2>
            <p style="color: var(--text-secondary); margin: 0;">Share your thoughts with your followers.</p>
        </div>

        <div class="editor-wrapper">
            <div class="error-message" th:if="${#fields.hasErrors('${createPostDTO.*}')}" style="margin-bottom: 1rem;">
                <ul style="margin: 0; padding-left: 20px;">
                    <li th:each="err : ${#fields.errors('${createPostDTO.*}')}" th:text="${err}"></li>
                </ul>
            </div>
            <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}" style="margin-bottom: 1rem;">
            </div>

            <form id="post-form" th:action="@{/writer/post/new}" th:object="${createPostDTO}" method="post">
                <input type="hidden" name="userId" th:value="${userId}" />

                <!-- Content as Main Editor -->
                <div class="form-group" style="margin-bottom: 2rem;">
                    <textarea id="content" th:field="*{content}" rows="15" required autofocus class="editor-title-input"
                        placeholder="What's on your mind? Start writing..."
                        style="width: 100%; resize: vertical; font-size: 1.1rem; font-weight: normal; line-height: 1.6; border-bottom: 1px solid var(--border-color);"></textarea>
                </div>

                <div class="form-actions">
                    <a th:href="@{/writer/home(userId=${userId})}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn" style="min-width: 120px;">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Check for saved theme preference or default to light theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        // Theme toggle click handler
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // Update theme icon
        function updateThemeIcon(theme) {
            themeToggle.textContent = theme === 'light' ? '🌙 Switch to Dark' : '☀️ Switch to Light';
        }
    </script>
</body>

</html>
