<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management | Flicker Admin</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
    <style>
        body {
            height: auto;
            min-height: 100vh;
            overflow-y: auto !important;
        }

        .container {
            height: auto;
            overflow-y: visible;
            padding-bottom: 50px;
        }

        .premium-form-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            position: relative;
            overflow: visible;
        }

        .premium-form-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--accent));
        }

        .form-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-1);
        }

        .form-subtitle {
            color: var(--text-3);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        input,
        select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-1);
            padding: 14px 18px;
            border-radius: 12px;
            width: 100%;
            font-family: var(--font-ui);
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
            background: var(--bg-card);
        }

        .btn-full {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            border-radius: 14px;
            font-weight: 700;
            margin-top: 8px;
        }

        .back-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-3);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 24px;
            transition: color 0.3s;
        }

        .back-nav:hover {
            color: var(--primary);
        }
    </style>
</head>

<body class="admin-theme" data-theme="dark">

    <header class="header">
        <div class="header-left">
            <button class="menu-toggle" onclick="document.body.classList.toggle('sidebar-collapsed')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none;">
                <h1><img src="/images/FLICKER.png" class="header-icon"> Admin Portal</h1>
            </a>
        </div>
        <div class="header-right">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-secondary btn-sm">Sign Out</button>
            </form>
        </div>
    </header>

    <nav class="nav">
        <div class="section-header">Core Management</div>
        <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
        <a th:href="@{/admin/users}">👥 User Directory</a>
        <a th:href="@{/admin/users/add}" class="active">👤 Provision Account</a>
        <a th:href="@{/admin/reports}">🚩 Content Reports</a>
        <button id="theme-toggle" onclick="toggleTheme()" style="margin-top: auto;">🌗 Toggle Mode</button>
    </nav>

    <main class="container">
        <a th:href="@{/admin/users}" class="back-nav">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to User Directory
        </a>

        <div class="premium-form-box" style="max-width: 800px;"> <!-- Increased max-width -->
            <h2 class="form-title">Create Account</h2>
            <p class="form-subtitle">Provision a new user account with specific privileges.</p>

            <form th:action="@{/admin/users/add}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                    <!-- Two column layout for better fit -->
                    <div class="form-group">
                        <label for="username">System Username</label>
                        <input type="text" id="username" name="username" required placeholder="e.g. john_doe">
                    </div>

                    <div class="form-group">
                        <label for="name">Legal Name</label>
                        <input type="text" id="name" name="name" required placeholder="e.g. Johnathan Doe">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Initial Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-group" style="grid-column: span 2;">
                        <label for="role">Assigned Access Role</label>
                        <select id="role" name="role" required style="margin-bottom: 12px;">
                            <option value="READER">Reader (Consumer)</option>
                            <option value="WRITER">Writer (Creator)</option>
                            <option value="ADMIN">Administrator (Staff)</option>
                        </select>
                    </div>

                    <div class="form-group" style="grid-column: span 2; margin-bottom: 8px;">
                        <label>Initial Content Preferences</label>
                        <p
                            style="font-size: 0.8rem; color: var(--text-3); margin-bottom: 12px; text-transform: none; letter-spacing: normal;">
                            Select topics this user will follow by default.</p>
                        <div
                            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;">
                            <label
                                th:each="interest : ${ {'technology','science','art','music','sports','travel','food','fashion','health','education','business','gaming','books','photography','design'} }"
                                style="display: flex; align-items: center; gap: 8px; cursor: pointer; background: var(--bg-input); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); transition: 0.2s; margin-bottom: 0;">
                                <input type="checkbox" name="selectedInterests" th:value="${interest}"
                                    style="width: auto; margin: 0; padding: 0; height: auto;">
                                <span th:text="${#strings.capitalize(interest)}"
                                    style="text-transform: capitalize; font-size: 0.85rem; font-weight: 500;">Interest</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 32px; display: flex; justify-content: flex-end; gap: 16px;">
                    <a th:href="@{/admin/users}" class="btn btn-secondary">Discard</a>
                    <button type="submit" class="btn btn-primary" style="min-width: 200px;">✅ Create User
                        Account</button>
                </div>
            </form>
        </div>
    </main>

    <script th:inline="javascript">
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            localStorage.setItem('admin-theme', next);
        }
        const savedTheme = localStorage.getItem('admin-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>
</body>

</html>
