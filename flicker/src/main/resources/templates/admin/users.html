<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory | Flicker Admin</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
    <style>
        /* Admin Users Page - Complete Layout Fix for Full Scrolling */

        /* Override the grid layout to allow natural document flow */
        body.admin-theme {
            display: block !important;
            height: auto !important;
            min-height: 100vh;
            overflow-y: auto !important;
        }

        /* Header stays fixed at top */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: var(--header-height);
        }

        /* Sidebar fixed on left */
        .nav {
            position: fixed;
            top: var(--header-height);
            left: 0;
            width: var(--sidebar-width);
            height: calc(100vh - var(--header-height));
            overflow-y: auto;
            z-index: 99;
        }

        /* Main content area - scrollable */
        .container {
            margin-left: var(--sidebar-width);
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
            height: auto !important;
            overflow: visible !important;
            padding: 48px;
            padding-bottom: 100px;
        }

        /* Ensure table container doesn't clip content */
        .glass-table-container {
            max-width: 100%;
            overflow-x: auto;
        }

        .glass-table-container table {
            min-width: 900px;
            width: 100%;
        }

        /* Responsive: collapse sidebar on mobile */
        @media (max-width: 768px) {
            .nav {
                transform: translateX(-100%);
            }

            .nav.open {
                transform: translateX(0);
            }

            .container {
                margin-left: 0;
            }
        }
    </style>
</head>

<body class="admin-theme" data-theme="dark">

    <header class="header">
        <div class="header-left">
            <button class="menu-toggle" onclick="document.body.classList.toggle('sidebar-collapsed')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none;">
                <h1><img src="/images/FLICKER.png" class="header-icon"> Admin Portal</h1>
            </a>
        </div>
        <div class="header-right">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-secondary btn-sm">Sign Out</button>
            </form>
        </div>
    </header>

    <nav class="nav">
        <div class="section-header">Core Management</div>
        <a th:href="@{/admin/dashboard}">
            <span style="margin-right: 12px;">📊</span> Dashboard
        </a>
        <a th:href="@{/admin/users}" class="active">
            <span style="margin-right: 12px;">👥</span> User Directory
        </a>
        <a th:href="@{/admin/users/add}">
            <span style="margin-right: 12px;">👤</span> Provision Account
        </a>
        <a th:href="@{/admin/reports}">
            <span style="margin-right: 12px;">🚩</span> Content Reports
        </a>

        <button id="theme-toggle" onclick="toggleTheme()" style="margin-top: auto;">
            <span>🌗</span> Toggle Mode
        </button>
    </nav>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px;">
            <div>
                <h2 style="font-size: 2.5rem; margin-bottom: 8px;">User Directory (<span
                        th:text="${users.size()}">0</span>)</h2>
                <p style="color: var(--text-3);">Manage authentication, roles, and account statuses.</p>
            </div>
            <a th:href="@{/admin/users/add}" class="btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    style="margin-right: 8px;">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Create Account
            </a>
        </div>

        <!-- Filter & Sort Controls -->
        <div class="filter-bar"
            style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; align-items: center;">
            <form id="filterForm" th:action="@{/admin/users}" method="get"
                style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">

                <!-- Sort by Name -->
                <div class="filter-group" style="display: flex; align-items: center; gap: 8px;">
                    <label style="color: var(--text-2); font-size: 0.9rem; font-weight: 600;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                            <path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"></path>
                        </svg>
                        Sort:
                    </label>
                    <select name="sort" onchange="document.getElementById('filterForm').submit()"
                        style="padding: 8px 16px; border-radius: 8px; background: var(--glass-bg); border: 1px solid var(--border); color: var(--text-1); font-size: 0.9rem; cursor: pointer;">
                        <option value="asc" th:selected="${currentSort == 'asc'}">Name A → Z</option>
                        <option value="desc" th:selected="${currentSort == 'desc'}">Name Z → A</option>
                    </select>
                </div>

                <!-- Filter by Role -->
                <div class="filter-group" style="display: flex; align-items: center; gap: 8px;">
                    <label style="color: var(--text-2); font-size: 0.9rem; font-weight: 600;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                        Role:
                    </label>
                    <select name="role" onchange="document.getElementById('filterForm').submit()"
                        style="padding: 8px 16px; border-radius: 8px; background: var(--glass-bg); border: 1px solid var(--border); color: var(--text-1); font-size: 0.9rem; cursor: pointer;">
                        <option value="all" th:selected="${currentRole == 'all'}">All Users</option>
                        <option value="reader" th:selected="${currentRole == 'reader'}">📖 Readers Only</option>
                        <option value="writer" th:selected="${currentRole == 'writer'}">✍️ Writers Only</option>
                    </select>
                </div>

                <!-- Reset Button -->
                <a th:href="@{/admin/users}" class="btn btn-sm btn-secondary" style="padding: 8px 16px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        style="margin-right: 4px;">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    Reset
                </a>
            </form>
        </div>

        <div class="glass-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Identity</th>
                        <th>Access Role</th>
                        <th>Account Health</th>
                        <th style="text-align: right;">Management</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <div class="user-identity">
                                <div class="avatar-circle"
                                    th:text="${user.name != null && !user.name.isEmpty() ? #strings.substring(user.name,0,1) : 'U'}">
                                    U</div>
                                <div>
                                    <div style="font-weight: 700;"
                                        th:text="${user.name != null ? user.name : 'Unknown User'}">Full Name</div>
                                    <div style="font-size: 0.8rem; color: var(--text-3);"
                                        th:text="'@' + ${user.username}">username</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span
                                th:class="'role-badge ' + ${user.role == 'READER' ? 'role-reader' : (user.role == 'WRITER' ? 'role-writer' : 'role-admin')}"
                                th:text="${user.role}">READER</span>
                        </td>
                        <td>
                            <div style="display: flex; align-items: center;">
                                <span
                                    th:class="'status-dot ' + ${user.accountStatus == 'ACTIVE' ? 'status-active' : 'status-freezed'}"></span>
                                <span th:text="${user.accountStatus}"
                                    style="font-size: 0.85rem; font-weight: 600;">ACTIVE</span>
                            </div>
                        </td>
                        <td>
                            <div class="action-btns">
                                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-secondary"
                                    title="Edit User">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" style="margin-right: 4px;">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                    Edit</a>

                                <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post">
                                    <input type="hidden" name="status"
                                        th:value="${user.accountStatus == 'ACTIVE' ? 'FREEZED' : 'ACTIVE'}" />
                                    <button type="submit" class="btn btn-sm"
                                        th:classappend="${user.accountStatus == 'ACTIVE' ? 'btn-secondary' : 'btn-glow'}"
                                        style="min-width: 90px;">
                                        <svg th:if="${user.accountStatus == 'ACTIVE'}" width="14" height="14"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                            style="margin-right: 4px;">
                                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                        </svg>
                                        <svg th:if="${user.accountStatus != 'ACTIVE'}" width="14" height="14"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                            style="margin-right: 4px;">
                                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                            <path d="m7 11 5-5 5 5"></path>
                                        </svg>
                                        <span
                                            th:text="${user.accountStatus == 'ACTIVE' ? 'Freeze' : 'Activate'}">Freeze</span>
                                    </button>
                                </form>

                                <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
                                    onsubmit="return confirm('DANGER: This will permanently delete this account. Continue?');">
                                    <button type="submit" class="btn btn-sm btn-secondary"
                                        style="color: var(--danger); border-color: rgba(239, 68, 68, 0.2);">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2.5" style="margin-right: 4px;">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path
                                                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                            </path>
                                        </svg>
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:inline="javascript">
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            localStorage.setItem('admin-theme', next);
        }
        const savedTheme = localStorage.getItem('admin-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>
</body>

</html>
