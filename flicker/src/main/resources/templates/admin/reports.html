<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Reports | Flicker Admin</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
    <style>
        .report-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 24px;
            align-items: center;
            transition: all 0.3s;
        }

        .report-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .report-type-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-input);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .report-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .report-reason {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-1);
        }

        .report-id {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-3);
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .report-status-badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 99px;
            text-transform: uppercase;
        }

        .status-pending {
            background: #FEF3C7;
            color: #92400E;
        }

        .status-resolved {
            background: #D1FAE5;
            color: #065F46;
        }

        .report-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body class="admin-theme" data-theme="dark">

    <header class="header">
        <div class="header-left">
            <button class="menu-toggle" onclick="document.body.classList.toggle('sidebar-collapsed')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none;">
                <h1><img src="/images/FLICKER.png" class="header-icon"> Admin Portal</h1>
            </a>
        </div>
        <div class="header-right">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-secondary btn-sm">Sign Out</button>
            </form>
        </div>
    </header>

    <nav class="nav">
        <div class="section-header">Core Management</div>
        <a th:href="@{/admin/dashboard}">
            <span style="margin-right: 12px;">📊</span> Dashboard
        </a>
        <a th:href="@{/admin/users}">
            <span style="margin-right: 12px;">👥</span> User Directory
        </a>
        <a th:href="@{/admin/users/add}">
            <span style="margin-right: 12px;">👤</span> Provision Account
        </a>
        <a th:href="@{/admin/reports}" class="active">
            <span style="margin-right: 12px;">🚩</span> Content Reports
        </a>

        <button id="theme-toggle" onclick="toggleTheme()" style="margin-top: auto;">
            <span>🌗</span> Toggle Mode
        </button>
    </nav>

    <main class="container">
        <div style="margin-bottom: 32px;">
            <h2 style="font-size: 2.5rem; margin-bottom: 8px;">Content Integrity</h2>
            <p style="color: var(--text-3);">Audit and resolve community safety reports.</p>
        </div>

        <div th:if="${reports.isEmpty()}"
            style="padding: 60px; text-align: center; background: var(--bg-card); border-radius: 24px; border: 1px dashed var(--border);">
            <div style="font-size: 3rem; margin-bottom: 16px;">🛡️</div>
            <h3 style="color: var(--text-2);">All Clear!</h3>
            <p style="color: var(--text-3);">There are no pending reports to review at this time.</p>
        </div>

        <div th:each="report : ${reports}" class="report-card">
            <div class="report-type-icon">
                <span th:if="${report.reportedEntityType == 'POST'}">📄</span>
                <span th:if="${report.reportedEntityType == 'COMMENT'}">💬</span>
            </div>

            <div class="report-meta">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                    <span
                        th:class="'report-status-badge ' + ${report.status == 'PENDING' ? 'status-pending' : 'status-resolved'}"
                        th:text="${report.status}">PENDING</span>
                    <span class="report-id" th:text="'ID: ' + ${report.id}">ID</span>
                </div>
                <div class="report-reason" th:text="${report.reason}">Spam or Misleading</div>
                <div style="font-size: 0.85rem; color: var(--text-3);">
                    Reported by <span style="color: var(--text-2); font-weight: 600;"
                        th:text="${report.reporterId}">User</span>
                    • <span th:text="${#temporals.format(report.timestamp, 'MMM dd, yyyy HH:mm')}">Time</span>
                </div>
            </div>

            <div class="report-actions" th:if="${report.status == 'PENDING'}">
                <form th:action="@{/admin/reports/{id}/resolve(id=${report.id})}" method="post">
                    <input type="hidden" name="action" value="DISMISS" />
                    <button type="submit" class="btn btn-sm btn-secondary">Dismiss</button>
                </form>

                <form th:action="@{/admin/reports/{id}/resolve(id=${report.id})}" method="post"
                    th:if="${report.offenderId != null}">
                    <input type="hidden" name="action" value="FREEZE" />
                    <input type="hidden" name="userId" th:value="${report.offenderId}" />
                    <button type="submit" class="btn btn-sm btn-glow">Freeze Author</button>
                </form>
            </div>

            <div th:if="${report.status != 'PENDING'}"
                style="color: var(--success); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">
                ✓ Resolved
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            localStorage.setItem('admin-theme', next);
        }
        const savedTheme = localStorage.getItem('admin-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>
</body>

</html>
