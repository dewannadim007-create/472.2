<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Flicker Admin</title>
    <link rel="stylesheet" th:href="@{/css/flicker-clean.css}">
    <link rel="icon" type="image/png" th:href="@{/images/FLICKER.png}">
    <style>
        .premium-form-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .premium-form-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--accent));
        }

        .form-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-1);
        }

        .form-subtitle {
            color: var(--text-3);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        input,
        select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-1);
            padding: 14px 18px;
            border-radius: 12px;
            width: 100%;
            font-family: var(--font-ui);
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
            background: var(--bg-card);
        }

        input[readonly] {
            opacity: 0.6;
            cursor: not-allowed;
            background: var(--bg-hover);
        }

        .btn-full {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            border-radius: 14px;
            font-weight: 700;
            margin-top: 8px;
        }

        .back-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-3);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 24px;
            transition: color 0.3s;
        }

        .back-nav:hover {
            color: var(--primary);
        }
    </style>
</head>

<body class="admin-theme" data-theme="dark">

    <header class="header">
        <div class="header-left">
            <button class="menu-toggle" onclick="document.body.classList.toggle('sidebar-collapsed')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none;">
                <h1><img src="/images/FLICKER.png" class="header-icon"> Admin Portal</h1>
            </a>
        </div>
        <div class="header-right">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-secondary btn-sm">Sign Out</button>
            </form>
        </div>
    </header>

    <nav class="nav">
        <div class="section-header">Core Management</div>
        <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
        <a th:href="@{/admin/users}" class="active">👥 User Directory</a>
        <a th:href="@{/admin/users/add}">👤 Provision Account</a>
        <a th:href="@{/admin/reports}">🚩 Content Reports</a>
        <button id="theme-toggle" onclick="toggleTheme()" style="margin-top: auto;">🌗 Toggle Mode</button>
    </nav>

    <main class="container">
        <a th:href="@{/admin/users}" class="back-nav">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to User Directory
        </a>

        <div class="premium-form-box">
            <h2 class="form-title">Operational Profile Audit</h2>
            <p class="form-subtitle" th:text="'Managing security records for @' + ${user.username}">Edit account
                details.</p>

            <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>System Identifier (Locked)</label>
                        <input type="text" th:value="${user.username}" readonly
                            style="background: var(--bg-hover); cursor: not-allowed; border-color: transparent;">
                    </div>

                    <div class="form-group">
                        <label>Registered Email (Locked)</label>
                        <input type="email" th:value="${user.email}" readonly
                            style="background: var(--bg-hover); cursor: not-allowed; border-color: transparent;">
                        <!-- Note: User object still needs to send email if controller expects it, otherwise making it read-only in form is enough -->
                        <input type="hidden" name="email" th:value="${user.email}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="name">Legal Name / Display Name</label>
                    <input type="text" id="name" name="name" th:value="${user.name}" required
                        placeholder="Update display name...">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label for="role">Access Level</label>
                        <select id="role" name="role" required>
                            <option value="READER" th:selected="${user.role == 'READER'}">Reader (Consumer)</option>
                            <option value="WRITER" th:selected="${user.role == 'WRITER'}">Writer (Creator)</option>
                            <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Administrator (Staff)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="accountStatus">Operational Status</label>
                        <select id="accountStatus" name="accountStatus" required>
                            <option value="ACTIVE" th:selected="${user.accountStatus == 'ACTIVE'}">🟢 Fully Active
                            </option>
                            <option value="FREEZED" th:selected="${user.accountStatus == 'FREEZED'}">❄️ Access Suspended
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label>Content Stream Audit (Interests)</label>
                    <p
                        style="font-size: 0.8rem; color: var(--text-3); margin-top: -8px; margin-bottom: 12px; text-transform: none;">
                        Topics currently tracked by this account.</p>
                    <div
                        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; background: var(--bg-hover); padding: 16px; border-radius: 12px; border: 1px solid var(--border);">
                        <label
                            th:each="interest : ${ {'technology','science','art','music','sports','travel','food','fashion','health','education','business','gaming','books','photography','design'} }"
                            style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 0;">
                            <input type="checkbox" name="selectedInterests" th:value="${interest}"
                                th:checked="${user.interests != null && user.interests.contains(interest)}"
                                style="width: auto; margin: 0; padding: 0; height: auto;">
                            <span th:text="${#strings.capitalize(interest)}"
                                style="text-transform: capitalize; font-size: 0.85rem; font-weight: 500;">Interest</span>
                        </label>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 32px;">
                    <a th:href="@{/admin/users}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
                    <button type="submit" class="btn" style="flex: 2;">Commit Changes</button>
                </div>
            </form>
        </div>
    </main>

    <script th:inline="javascript">
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            localStorage.setItem('admin-theme', next);
        }
        const savedTheme = localStorage.getItem('admin-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>
</body>

</html>
